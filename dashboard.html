<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#DCE2E7; --panel:#F4F5F7; --panel-2:#ECEEF1; --panel-3:#E0E4E8;
  --ink:#101316; --ink-2:#56606A; --ink-3:#8A949C; --black:#101316;
  --blue:#42B0D5; --blue-2:#9BD3E8; --blue-3:#D3EBF5; --blue-4:#EAF5FA; --link:#0A78AB;
  --tint:#E0E4E8; --tint-2:#C9D0D6; --paper:var(--bg); --deep:#0E3F58;
  --mint:#D3EBF5; --lime:#D3EBF5;
  --crawl:#B6DCEC; --walk:#6DBDDE; --run:#2E92BF;
  --green:#2E9E6B; --amber:#E0A126; --red:#D5524E;
  --r-xl:26px; --r-lg:22px; --r-md:16px; --r-sm:12px;
  --line:rgba(16,19,22,.08);
  --shadow:0 8px 28px rgba(16,19,22,.06); --rail:0px;
  --font:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;

  --accent:#42B0D5; --accent-rgb:66,176,213; --d-rgb:90,170,212; --m-rgb:140,200,228; --l2-rgb:196,226,240; --l1-rgb:235,246,251;
  --a1:#EBF6FB; --a2:#C9E5F1; --a3:#8CCBE5; --a4:#3A9FCB; --a5:#1B7DA6; --ink-a:#17566f;
  --rgb-crawl:143,208,234; --rgb-walk:77,182,218; --rgb-run:58,160,200;
  --hero-tint:#4F8FAF; --blob1:#7FB0CB; --blob2:#93AEBF;
}
html[data-theme="sage"]{--bg:#DDE3DD;--accent:#6E9A7F;--accent-rgb:110,154,127;--d-rgb:84,132,104;--m-rgb:150,186,160;--l2-rgb:208,226,212;--l1-rgb:238,245,239;
 --a1:#EFF6F0;--a2:#D2E3D6;--a3:#A3C4AE;--a4:#6E9A7F;--a5:#47765A;--ink-a:#2F5A3F;--blue:#6E9A7F;--blue-2:#A9C8B3;--blue-3:#D9E8DC;--blue-4:#EBF3EC;--link:#2F6B47;
 --crawl:#CDE2D2;--walk:#9CC3A6;--run:#5F9473;--rgb-crawl:190,218,198;--rgb-walk:140,185,152;--rgb-run:86,138,106;--hero-tint:#5D8A6C;--blob1:#86AE92;--blob2:#A3B3A5}
html[data-theme="peach"]{--bg:#E6DFDA;--accent:#E39A78;--accent-rgb:227,154,120;--d-rgb:206,126,92;--m-rgb:236,184,156;--l2-rgb:246,218,203;--l1-rgb:253,243,237;
 --a1:#FDF3EE;--a2:#F6D9CB;--a3:#EFB9A0;--a4:#E0906A;--a5:#B8603A;--ink-a:#7A3E22;--blue:#E39A78;--blue-2:#F1C3AC;--blue-3:#F9E2D6;--blue-4:#FCEFE8;--link:#A34E2A;
 --crawl:#F3D8CB;--walk:#EDB59A;--run:#D9805B;--rgb-crawl:240,200,180;--rgb-walk:232,160,125;--rgb-run:208,112,72;--hero-tint:#C98160;--blob1:#E5B49C;--blob2:#D6B9AA}
html[data-theme="grey"]{--bg:#DEDFE1;--accent:#6F7B87;--accent-rgb:112,124,136;--d-rgb:90,102,114;--m-rgb:160,170,180;--l2-rgb:214,219,224;--l1-rgb:241,243,245;
 --a1:#F3F5F7;--a2:#D9DEE3;--a3:#B2BBC3;--a4:#7C8893;--a5:#4F5A64;--ink-a:#38424B;--blue:#6F7B87;--blue-2:#B6BEC6;--blue-3:#DFE3E7;--blue-4:#EEF0F2;--link:#3A4752;
 --crawl:#D8DCE0;--walk:#AEB6BD;--run:#76818B;--rgb-crawl:204,210,216;--rgb-walk:164,174,184;--rgb-run:112,124,136;--hero-tint:#6C7580;--blob1:#A3AAB1;--blob2:#B5B8BC}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.55;overflow-x:hidden;letter-spacing:0}
h1,h2,h3,h4,h5{margin:0;line-height:1.15;font-weight:400;letter-spacing:-.015em}
a{color:var(--link)}button{font-family:inherit}img{max-width:100%}
.bg{position:fixed;inset:0;z-index:-3;background:var(--bg);overflow:hidden}
.bg.has-photo{background-size:cover,cover;background-position:center,center;background-repeat:no-repeat}
.bg.duo::after{content:"";position:absolute;inset:0;background:var(--hero-tint);mix-blend-mode:color}
.bg.has-photo .bl,.bg.has-photo .arcs{display:none}
.bl{position:absolute;border-radius:50%;filter:blur(90px);opacity:.2}
.bl.b1{left:-10%;top:-16%;width:40vw;height:40vw;background:var(--blob1)}
.bl.b2{right:-12%;bottom:-18%;width:38vw;height:38vw;background:var(--blob2)}
.bl.b3{display:none}
.arcs{position:absolute;inset:0;width:100%;height:100%}
.bgveil{position:fixed;inset:0;z-index:-2;pointer-events:none;background:rgba(244,246,248,var(--va,0))}
body.nav-pinned{--rail:94px}
.acct-tile,.zone.az,.rm4>div,.mini,.mc,.ic2,.bx,.pill,.wc,.askc .chips a,.seg button.on,.lrow .ib2,.lrow .ar{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
@media (max-width:900px){body.nav-pinned{--rail:0px}}

/* ---------- glass (one level only: never nest backdrop-filter) ---------- */
.glass{background:rgba(244,245,247,.86);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:0;border-radius:var(--r-lg);box-shadow:var(--shadow)}
.soft{background:var(--panel-2);border:0;border-radius:var(--r-md)}
.gz{background:rgba(255,255,255,.36);-webkit-backdrop-filter:blur(18px) saturate(1.1);backdrop-filter:blur(18px) saturate(1.1);border:1px solid rgba(255,255,255,.55);border-radius:var(--r-lg);box-shadow:0 14px 40px rgba(var(--accent-rgb),.08)}
/* controls: soft gray keys, black for the main action */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:13px;border:0;background:rgba(224,228,232,.62);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--ink);font:400 14px var(--font);cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,transform .15s}
.btn:hover{background:rgba(204,211,217,.82)}.btn:active{transform:translateY(1px)}
.btn.arr::after{content:"\2197";font-size:13px;opacity:.7}
.btn.dark{background:var(--ink);color:#fff}.btn.dark:hover{background:#2A3138}.btn.dark.arr::after{opacity:.8}
.btn.light{background:rgba(255,255,255,.9)}.btn.light:hover{background:#fff}
.btn.blue{background:var(--blue);color:#06222E}.btn.blue:hover{background:var(--blue-2)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:11px}
.btn.icon{width:38px;height:38px;padding:0;border-radius:13px}
.btn.on{background:var(--ink);color:#fff}
.btn:focus-visible,a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.seg{display:inline-flex;padding:4px;border-radius:15px;background:rgba(224,228,232,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.seg button{border:0;background:transparent;padding:7px 15px;border-radius:11px;font:400 14px var(--font);color:var(--ink-2);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,19,22,.10)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:400;border-radius:10px;padding:3px 10px;background:rgba(224,228,232,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--ink-2)}
.eyebrow,.tagc{display:inline-block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:400;padding:0;background:none;color:var(--ink-3)}
.wrap{width:min(1180px,90vw);margin:0 auto}

/* ---------- compact page header (roadmap, RACI) ---------- */
.mh{display:flex;align-items:center;gap:14px;width:fit-content;max-width:100%;padding:9px 22px 9px 10px;border-radius:20px}
.mh .ic{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.55);display:grid;place-items:center;flex:none}
.mh .ic svg{width:21px;height:21px;stroke:var(--ink);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mh h1{font-size:24px;font-weight:300;letter-spacing:-.02em;white-space:nowrap;line-height:1.1}
.mh small{display:block;font-size:12.5px;color:var(--ink-2);margin-top:3px}
.sec{width:min(1240px,calc(100% - 40px));margin:28px auto 0}
.sec-h{margin:0 0 14px}.sec-h h2{font-weight:300;font-size:clamp(26px,2.8vw,38px);letter-spacing:-.025em}.sec-h p{margin:6px 0 0;color:var(--ink-2);max-width:72ch}
.tbl{overflow-x:auto;border-radius:var(--r-lg)}
table.t{border-collapse:collapse;width:100%;font-size:14.5px}
table.t th{text-align:left;padding:13px 16px;font-weight:500;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
table.t td{padding:14px 16px;border-top:1px solid var(--line);vertical-align:top}
table.t td.mono{font-weight:700;color:var(--link);white-space:nowrap}
.fate{display:inline-block;font-size:12.5px;font-weight:400;border-radius:9px;padding:2px 10px;background:var(--blue-3);color:var(--ink-a);white-space:nowrap}.fate.no{background:var(--panel-3);color:var(--ink-3)}
.note-box{padding:16px 22px;border-left:4px solid var(--amber)}
ul.refs{padding-left:20px;margin:6px 0;color:var(--ink-2);font-size:14.5px}ul.refs li{margin:6px 0}
.page-end{height:120px}
.av{position:relative;overflow:hidden;flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:600;color:var(--ink-a);background:hsl(var(--h,200) 70% 82%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.85)}.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* ---------- left rail (auto-hide): a quiet column of keys, grouped like a tool palette ---------- */
.nav-hot{position:fixed;left:0;top:0;bottom:0;width:26px;z-index:110}
.gn-handle{position:fixed;left:5px;top:50%;transform:translateY(-50%);width:5px;height:64px;border-radius:5px;border:0;padding:0;background:var(--ink);opacity:.35;z-index:109;cursor:pointer;transition:opacity .3s,width .2s}
.gn-handle:hover{width:8px;opacity:.6}body.nav-open .gn-handle{opacity:0}
.gnav{position:fixed;left:14px;top:14px;bottom:14px;width:66px;z-index:120;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 8px;border-radius:26px;background:rgba(244,245,247,.7)!important;-webkit-backdrop-filter:blur(22px) saturate(1.1);backdrop-filter:blur(22px) saturate(1.1);border:1px solid rgba(255,255,255,.55);box-shadow:0 14px 40px rgba(16,19,22,.14)!important;transform:translateX(calc(-100% - 30px));transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.gnav.show{transform:none}
.gn-logo{width:44px;height:44px;border-radius:50%;background:var(--blue);display:grid;place-items:center;margin:2px 0 4px}
.gn-logo i{width:14px;height:14px;border:3px solid var(--ink);border-left-color:transparent;border-bottom-color:transparent;transform:rotate(45deg) translate(-2px,2px);border-radius:2px}
.gn-grp{display:flex;flex-direction:column;gap:4px;padding:5px;border-radius:18px;background:rgba(236,238,241,.55);width:100%;align-items:center}
.gn-links{display:flex;flex-direction:column;gap:4px}.gn-spacer{flex:1}
.gn-ico{position:relative;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--ink-2);background:transparent;border:0;cursor:pointer;transition:background .18s,color .18s;text-decoration:none}
.gn-ico svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.gn-ico:hover{background:var(--panel-3);color:var(--ink)}.gn-ico.on{background:var(--panel-3);color:var(--ink)}
body.edits-on #rvToggle{background:#FFE770;color:#4a3b00}
body.nav-pinned .gnav{transform:none}body.nav-pinned .gn-handle,body.nav-pinned .nav-hot{display:none}
#navMode.on{background:var(--ink);color:#fff}
.gn-ico em{position:absolute;right:2px;top:2px;font-style:normal;font-size:10px;font-weight:500;background:var(--ink);color:#fff;border-radius:8px;min-width:16px;padding:0 4px;text-align:center}
.gn-ico[data-tip]::after{content:attr(data-tip);position:absolute;left:calc(100% + 14px);top:50%;transform:translateY(-50%) translateX(-6px);white-space:nowrap;font-size:13px;font-weight:400;background:var(--ink);color:#fff;padding:6px 12px;border-radius:10px;opacity:0;pointer-events:none;transition:.18s}
.gn-ico:hover::after{opacity:1;transform:translateY(-50%)}
.acct{position:relative}
.gn-av{width:44px;height:44px;border-radius:14px;padding:0;border:0;overflow:hidden;cursor:pointer;background:#fff;display:block}.gn-av img{width:100%;height:100%;display:block}
.acct-pop{position:absolute;left:calc(100% + 24px);bottom:-4px;width:300px;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px;opacity:0;pointer-events:none;transform:translateX(-12px) scale(.97);transform-origin:left bottom;transition:opacity .25s,transform .25s;background:rgba(244,245,247,.74);-webkit-backdrop-filter:blur(22px) saturate(1.1);backdrop-filter:blur(22px) saturate(1.1);border:1px solid rgba(255,255,255,.55);border-radius:var(--r-lg);box-shadow:0 18px 50px rgba(16,19,22,.18)}
.acct-pop::before{content:"";position:absolute;left:-28px;top:0;bottom:0;width:28px}
.acct:hover .acct-pop,.acct.open .acct-pop{opacity:1;pointer-events:auto;transform:none}
.acct-h{grid-column:1/-1;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:400;color:var(--ink-3)}
.acct-tile{aspect-ratio:1/1;border-radius:var(--r-md);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:var(--ink);background:rgba(255,255,255,.5);text-align:center;padding:8px;transition:background .16s}
.acct-tile:hover{background:var(--panel-3)}
.acct-tile img{width:56px;height:56px;border-radius:16px}.acct-tile b{font-size:13.5px;font-weight:500}.acct-tile small{font-size:11.5px;color:var(--ink-3);line-height:1.2}
.acct-tile.cur{box-shadow:inset 0 0 0 2px var(--blue)}

/* ---------- page change: native slide transition (instant, no wait) ---------- */
@view-transition{navigation:auto}
::view-transition-group(root){animation-duration:.8s}
::view-transition-old(root),::view-transition-new(root){animation-duration:.8s;animation-timing-function:cubic-bezier(.76,0,.18,1);animation-fill-mode:both;mix-blend-mode:normal}
::view-transition-old(root){animation-name:vtOldF}
::view-transition-new(root){animation-name:vtNewF;box-shadow:0 -30px 80px rgba(var(--accent-rgb),.28)}
html[data-vt=back]::view-transition-old(root){animation-name:vtOldB}
html[data-vt=back]::view-transition-new(root){animation-name:vtNewB;box-shadow:0 30px 80px rgba(var(--accent-rgb),.28)}
@keyframes vtOldF{to{transform:translateY(-24%) scale(.96);filter:brightness(.85)}}
@keyframes vtNewF{from{transform:translateY(100%);border-radius:36px 36px 0 0}to{transform:none;border-radius:0}}
@keyframes vtOldB{to{transform:translateY(24%) scale(.96);filter:brightness(.85)}}
@keyframes vtNewB{from{transform:translateY(-100%);border-radius:0 0 36px 36px}to{transform:none;border-radius:0}}
/* fallback (file:// or older browsers): slide only, no opacity on the wrapper, no lingering animation */
.stage{position:relative;padding-left:var(--rail);transition:padding-left .35s cubic-bezier(.2,.8,.2,1)}
html.leaving-down .stage{transition:transform .55s cubic-bezier(.76,0,.18,1);transform:translateY(-60px)}
html.leaving-up .stage{transition:transform .55s cubic-bezier(.76,0,.18,1);transform:translateY(60px)}
html.enter-down .stage{animation:fbUp .7s cubic-bezier(.2,.8,.2,1) backwards}
html.enter-up .stage{animation:fbDown .7s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes fbUp{from{transform:translateY(100vh)}}@keyframes fbDown{from{transform:translateY(-100vh)}}
.pager{position:fixed;left:50%;bottom:22px;z-index:90;transform:translate(-50%,24px);opacity:0;pointer-events:none;transition:.35s cubic-bezier(.2,.8,.2,1);display:flex;align-items:center;gap:10px;padding:8px 18px 8px 8px;border-radius:16px;background:var(--ink);color:#fff;font-size:13.5px;font-weight:400;cursor:pointer;box-shadow:0 12px 30px rgba(20,24,27,.35)}
.pager.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.pager i{width:26px;height:26px;border-radius:9px;background:var(--panel-3);color:var(--ink);display:grid;place-items:center;color:#07222D;font-style:normal;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}
.toast{position:fixed;left:50%;bottom:26px;z-index:140;transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:.3s;padding:10px 18px;border-radius:14px;background:var(--black);color:#fff;font-size:14px;font-weight:400;box-shadow:0 10px 30px rgba(20,24,27,.3)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- review mode ---------- */
body.edits-on .fix[data-kind=add]{background:#FFF08A;box-shadow:0 0 0 3px #FFF08A;border-radius:3px}
body.edits-on .fix[data-kind=edit]{background:#FFC9D9;box-shadow:0 0 0 3px #FFC9D9;border-radius:3px}
body.edits-on .fix[data-kind=verify]{background:#FFE2BD;box-shadow:0 0 0 2px #F2994A;border-radius:3px}
body.edits-on .fix-block{position:relative}
body.edits-on .fix-block::before{position:absolute;right:8px;top:-9px;font-size:10px;font-weight:800;letter-spacing:.08em;padding:1px 7px;border-radius:8px;color:#222;z-index:6}
body.edits-on .fix-block[data-kind=add]::before{content:"ADDED";background:#FFE770}
body.edits-on .fix-block[data-kind=edit]::before{content:"FIXED";background:#FFB6CB}
body.edits-on .fix-block[data-kind=verify]::before{content:"VERIFY";background:#FFC98A}
.flash{animation:flash 1.5s ease}
@keyframes flash{0%,60%{outline:4px solid #F2994A;outline-offset:4px}100%{outline:4px solid transparent;outline-offset:4px}}
.wc{display:none;margin-top:12px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:#FFE770;color:#4a3b00;width:fit-content}body.edits-on .wc{display:block}
.drawer{position:fixed;top:14px;right:14px;bottom:14px;width:min(430px,92vw);z-index:150;transform:translateX(calc(100% + 30px));transition:transform .4s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow:hidden}
.drawer.open{transform:none}
.drawer-h{padding:16px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.drawer-h h3{font-size:17px}
.drawer-b{overflow:auto;padding:12px 16px 24px}.drawer-b .hint{font-size:13.5px;color:var(--ink-2);margin:0 0 6px}
.di{display:block;width:100%;text-align:left;background:rgba(255,255,255,.7);border:1px solid #fff;border-radius:var(--r-sm);padding:10px 12px;margin:8px 0;cursor:pointer;font:inherit;font-size:14px;color:var(--ink)}.di:hover{border-color:var(--blue)}
.di .k{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.08em;padding:1px 8px;border-radius:7px;margin-right:8px}
.di .k.add{background:#FFE770}.di .k.edit{background:#FFB6CB}.di .k.verify{background:#FFC98A}
.di .sn{display:block;color:var(--ink-3);font-size:12.5px;margin-top:4px}
.themepop{position:fixed;left:calc(96px + 12px);bottom:18px;width:260px;z-index:135;padding:16px;opacity:0;pointer-events:none;transform:translateY(8px);transition:.22s}.themepop.show{opacity:1;pointer-events:auto;transform:none}
.themepop h4{font-size:17px;font-weight:400;margin-bottom:10px}.themepop .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.themepop button{display:flex;align-items:center;gap:10px;padding:9px 12px;border:0;border-radius:14px;background:rgba(255,255,255,.55);font:400 14px var(--font);color:var(--ink);cursor:pointer;text-align:left}.themepop button:hover{background:rgba(255,255,255,.85)}.themepop button.on{box-shadow:inset 0 0 0 2px var(--ink);background:#fff}
.themepop i{width:26px;height:26px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(16,19,22,.12)}
.bgpop{position:fixed;left:calc(96px + 12px);bottom:18px;width:310px;z-index:135;padding:16px;opacity:0;pointer-events:none;transform:translateY(8px);transition:.22s}

<script>

(function(){
var C=window.G1CFG, ORDER=C.order, PAGE=C.page;
var G1=window.G1={cfg:C, leaving:false, noWheelNav:false};
G1.esc=function(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')};
G1.load=function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
G1.save=function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
var toastT; G1.toast=function(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show')},2600)};
G1.modalOpen=function(){return !!document.querySelector('.is-modal.show')};

/* ---------- page change ---------- */
function idx(u){var f=(u||'').split('#')[0].split('?')[0].split('/').pop()||'index.html';return ORDER.indexOf(f)}
addEventListener('pageswap',function(e){try{if(e.activation&&e.activation.entry){document.documentElement.dataset.vt=idx(e.activation.entry.url)<idx(location.href)?'back':'fwd'}}catch(_){}});
addEventListener('pagereveal',function(e){try{var f=navigation.activation&&navigation.activation.from;if(f)document.documentElement.dataset.vt=idx(f.url)>idx(location.href)?'back':'fwd'}catch(_){}});
var nativeVT=('PageRevealEvent' in window)&&/^https?:$/.test(location.protocol)&&!(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches);
G1.go=function(href,dir){
  if(G1.leaving) return;
  var file=href.split('#')[0], hash=href.indexOf('#')>-1?href.slice(href.indexOf('#')):'';
  if(file===PAGE||file===''){ if(hash) location.hash=hash; return }
  G1.leaving=true; dir=dir||(ORDER.indexOf(file)>ORDER.indexOf(PAGE)?'down':'up');
  if(nativeVT){ location.href=href; return }
  try{sessionStorage.setItem('g1t',JSON.stringify({dir:dir,ts:Date.now()}))}catch(e){}
  document.documentElement.classList.add('leaving-'+dir);
  setTimeout(function(){location.href=href},520);
};
addEventListener('pageshow',function(e){ if(e.persisted){G1.leaving=false;document.documentElement.classList.remove('leaving-down','leaving-up')} });
(function(){var s=document.querySelector('.stage');if(s)s.addEventListener('animationend',function(){document.documentElement.classList.remove('enter-down','enter-up')})})();
document.addEventListener('click',function(e){
  var a=e.target.closest('a[href]'); if(!a||e.defaultPrevented||e.metaKey||e.ctrlKey||e.shiftKey||a.target==='_blank') return;
  var h=a.getAttribute('href'), f=h.split('#')[0];
  if(ORDER.indexOf(f)>-1 && f!==PAGE){ e.preventDefault(); G1.go(h) }
});

/* ---------- avatars fetched from the internet (with a lettered fallback) ---------- */
G1.avatarUrl=function(seed){return 'https://api.dicebear.com/9.x/notionists-neutral/svg?seed='+encodeURIComponent(seed)+'&backgroundColor=d3ebf5,bfe0ef,e6f3f9'};
G1.av=function(seed,abbr,hue,cls){return '<span class="av '+(cls||'')+'" style="--h:'+hue+'">'+G1.esc(abbr)+'<img src="'+G1.avatarUrl(seed)+'" alt="" loading="lazy" onerror="this.remove()"></span>'};

/* ---------- left rail: shown by default; auto-hide is the default only on the roadmap and dashboard ---------- */
(function(){
  var nav=document.getElementById('gnav'),hot=document.getElementById('navHot'),handle=document.getElementById('gnHandle'),acct=document.getElementById('acct'),btn=document.getElementById('navMode'),t;
  var KEY='g1-nav-'+PAGE,DEF=(PAGE==='roadmap.html'||PAGE==='dashboard.html'),auto=G1.load(KEY,DEF);
  function pinned(){return !auto&&innerWidth>=900}
  function refresh(){var p=pinned();document.body.classList.toggle('nav-pinned',p);if(p)nav.classList.add('show');else if(!nav.matches(':hover'))nav.classList.remove('show');
    btn.classList.toggle('on',!auto);btn.setAttribute('data-tip',auto?'Auto-hide is on. Click to keep the menu visible':'Menu is pinned. Click to auto-hide it');btn.setAttribute('aria-pressed',String(!auto))}
  function show(){clearTimeout(t);nav.classList.add('show');document.body.classList.add('nav-open')}
  function hide(){clearTimeout(t);if(pinned())return;t=setTimeout(function(){if(pinned()||nav.matches(':hover')||document.querySelector('.bgpop.show,.themepop.show')||nav.contains(document.activeElement)&&document.activeElement.matches(':focus-visible'))return;acct.classList.remove('open');nav.classList.remove('show');document.body.classList.remove('nav-open')},450)}
  hot.addEventListener('pointerenter',show);hot.addEventListener('pointermove',function(){if(!nav.classList.contains('show'))show()});hot.addEventListener('pointerleave',hide);
  nav.addEventListener('pointerenter',show);nav.addEventListener('pointerleave',hide);nav.addEventListener('focusin',show);nav.addEventListener('focusout',hide);
  handle.addEventListener('click',function(){nav.classList.contains('show')?(nav.classList.remove('show'),document.body.classList.remove('nav-open')):show()});
  btn.addEventListener('click',function(){auto=!auto;G1.save(KEY,auto);refresh();if(auto){setTimeout(function(){if(!nav.matches(':hover'))hide()},900)}});
  acct.querySelector('.gn-av').addEventListener('click',function(e){e.stopPropagation();acct.classList.toggle('open')});
  document.addEventListener('click',function(e){if(!acct.contains(e.target))acct.classList.remove('open');if(!pinned()&&!nav.contains(e.target)&&window.matchMedia('(hover:none)').matches){nav.classList.remove('show');document.body.classList.remove('nav-open')}});
  addEventListener('resize',refresh);
  G1.toggleNav=function(){nav.classList.contains('show')?(nav.classList.remove('show'),document.body.classList.remove('nav-open')):show()};
  refresh();
  try{if(auto&&!sessionStorage.getItem('g1peek')){sessionStorage.setItem('g1peek','1');setTimeout(function(){show();setTimeout(hide,2200)},700)}}catch(e){}
})();

/* ---------- replace the page background with a real photo (upload or link), per page ---------- */
(function(){
  var KEY='g1-bg-'+PAGE,bg=document.getElementById('bg'),vl=document.getElementById('bgveil'),root=document.documentElement,btn=document.getElementById('bgBtn'),pop=null,DEF=bg.getAttribute('data-def')||'',DEFVA=parseFloat(vl.getAttribute('data-va')||'0');
  function apply(){var s=G1.load(KEY,null);
    if(s&&s.src){bg.style.backgroundImage='url("'+s.src+'")';bg.classList.add('has-photo','custom');bg.classList.remove('duo');bg.style.filter=s.blur?'blur('+s.blur+'px)':'';bg.style.transform=s.blur?'scale(1.06)':'';vl.style.setProperty('--va',(s.veil==null?40:s.veil)/100);
      if(PAGE==='index.html')root.style.setProperty('--hero-img','url("'+s.src+'")')}
    else{bg.style.backgroundImage=DEF;bg.classList.remove('custom');if(DEF){bg.classList.add('duo')}else{bg.classList.remove('has-photo')}bg.style.filter='';bg.style.transform='';vl.style.setProperty('--va',DEFVA);root.style.removeProperty('--hero-img')}}
  function save(s,all){try{if(all){['index.html','roadmap.html','raci.html','dashboard.html'].forEach(function(f){localStorage.setItem('g1-bg-'+f,JSON.stringify(s))})}else localStorage.setItem(KEY,JSON.stringify(s));apply();ui();return true}catch(e){G1.toast('That photo is too large to store in the browser. Try a smaller one or paste a link.');return false}}
  function cur(){return G1.load(KEY,null)||{src:'',veil:40,blur:0}}
  function fromFile(f,all){if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var m=1920,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);var q=.82,d=c.toDataURL('image/jpeg',q);while(d.length>2.6e6&&q>.4){q-=.1;d=c.toDataURL('image/jpeg',q)}var o=cur();save({src:d,veil:o.src?o.veil:40,blur:o.blur||0},all)};im.onerror=function(){G1.toast('That file is not an image')};im.src=r.result};r.readAsDataURL(f)}
  function fromUrl(u,all){u=(u||'').trim();if(!/^(https?:\/\/|data:image\/)/i.test(u)){G1.toast('Paste a link that starts with https://');return}var im=new Image();im.onload=function(){var o=cur();save({src:u,veil:o.src?o.veil:40,blur:o.blur||0},all)};im.onerror=function(){G1.toast('That link could not be loaded as an image')};im.src=u}
  function ui(){if(!pop)return;var s=G1.load(KEY,null),pv=pop.querySelector('.prev');if(s&&s.src){pv.style.backgroundImage='url("'+s.src+'")';pv.textContent=''}else{pv.style.backgroundImage='';pv.textContent=DEF?'Default photo':'Default background'}
    pop.querySelector('[data-k=veil]').value=s&&s.src?s.veil:40;pop.querySelector('[data-k=blur]').value=s&&s.src?(s.blur||0):0;pop.querySelector('[data-o=veil]').textContent=(s&&s.src?s.veil:40)+'%';pop.querySelector('[data-o=blur]').textContent=(s&&s.src?(s.blur||0):0)+'px'}
  function build(){pop=document.createElement('div');pop.className='bgpop glass is-modal';pop.innerHTML='<h4>Page background</h4><p>Use your own photo behind this page. It is saved in this browser only.</p><div class="prev"></div><div class="row"><button class="btn sm" type="button" data-a="up">Upload photo</button><input type="file" accept="image/*" hidden></div><div class="row"><input type="text" placeholder="or paste an image link (https://\u2026)" aria-label="Image link"><button class="btn sm" type="button" data-a="url">Use</button></div><label>Light veil <span data-o="veil">40%</span></label><input type="range" min="0" max="90" step="5" data-k="veil"><label>Blur <span data-o="blur">0px</span></label><input type="range" min="0" max="24" step="2" data-k="blur"><div class="acts"><button class="btn sm" type="button" data-a="all">Use on all pages</button><button class="btn sm" type="button" data-a="reset">Reset</button><button class="btn sm dark" type="button" data-a="close">Done</button></div>';document.body.appendChild(pop);
    var file=pop.querySelector('input[type=file]'),txt=pop.querySelector('input[type=text]');
    pop.addEventListener('click',function(e){var a=e.target.closest('[data-a]');if(!a)return;a=a.dataset.a;
      if(a==='up')file.click();else if(a==='url')fromUrl(txt.value,false);else if(a==='close')close();
      else if(a==='reset'){try{localStorage.removeItem(KEY)}catch(_){}apply();ui();G1.toast('Background reset')}
      else if(a==='all'){var s=G1.load(KEY,null);if(!s||!s.src){G1.toast('Choose a photo first');return}if(save(s,true))G1.toast('Photo applied to all four pages')}});
    file.addEventListener('change',function(){fromFile(file.files[0],false);file.value=''});
    txt.addEventListener('keydown',function(e){if(e.key==='Enter')fromUrl(txt.value,false)});
    pop.addEventListener('input',function(e){var k=e.target.dataset&&e.target.dataset.k;if(!k)return;var s=cur();if(!s.src){G1.toast('Choose a photo first');e.target.value=k==='veil'?40:0;return}s[k]=+e.target.value;try{localStorage.setItem(KEY,JSON.stringify(s))}catch(_){}apply();ui()});
    ui()}
  function open(){if(!pop)build();pop.classList.add('show');ui()}function close(){if(pop)pop.classList.remove('show')}
  btn.addEventListener('click',function(e){e.stopPropagation();pop&&pop.classList.contains('show')?close():open()});
  document.addEventListener('pointerdown',function(e){if(pop&&pop.classList.contains('show')&&!pop.contains(e.target)&&!e.target.closest('#bgBtn'))close()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
  apply();
})();

/* ---------- colour themes: Maersk blue (default), sage, peach, grey ---------- */
(function(){
  var KEY='g1-theme',T=[['blue','Maersk blue','#42B0D5','#DCE2E7'],['sage','Sage','#6E9A7F','#DDE3DD'],['peach','Peach','#E39A78','#E6DFDA'],['grey','Grey','#6F7B87','#DEDFE1']],btn=document.getElementById('themeBtn'),pop=null;
  function cur(){return G1.load(KEY,'blue')||'blue'}
  function apply(t){if(t==='blue')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);if(G1.onTheme)G1.onTheme(t)}
  function mark(){if(!pop)return;[].forEach.call(pop.querySelectorAll('button'),function(b){var on=b.dataset.t===cur();b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)})}
  function build(){pop=document.createElement('div');pop.className='themepop glass is-modal';pop.innerHTML='<h4>Colour theme</h4><div class="opts">'+T.map(function(t){return '<button type="button" data-t="'+t[0]+'"><i style="background:linear-gradient(135deg,'+t[2]+' 52%,'+t[3]+' 52%)"></i>'+t[1]+'</button>'}).join('')+'</div>';document.body.appendChild(pop);
    pop.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;G1.save(KEY,b.dataset.t);apply(b.dataset.t);mark()});mark()}
  function open(){var o=document.querySelector('.bgpop.show');if(o)o.classList.remove('show');if(!pop)build();pop.classList.add('show');mark()}function close(){if(pop)pop.classList.remove('show')}
  btn.addEventListener('click',function(e){e.stopPropagation();pop&&pop.classList.contains('show')?close():open()});
  document.addEventListener('pointerdown',function(e){if(pop&&pop.classList.contains('show')&&!pop.contains(e.target)&&!e.target.closest('#themeBtn'))close()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
  var bb=document.getElementById('bgBtn');if(bb)bb.addEventListener('click',close);
  apply(cur());
})();

/* ---------- scroll past the end: next page slides in immediately ---------- */
(function(){
  var idxp=ORDER.indexOf(PAGE), next=ORDER[idxp+1], prev=ORDER[idxp-1], pg=document.getElementById('pager');
  if(next) pg.innerHTML='<i>\u2193</i><span>Keep scrolling: '+C.labels[next]+'</span>';
  var atB=null,atT=null,acc=0,accT=0;
  function bottom(){return innerHeight+scrollY>=document.documentElement.scrollHeight-3}
  function top(){return scrollY<=2}
  function poll(){var n=Date.now();
    if(bottom()){if(atB===null)atB=n}else atB=null;

  var plan=x(m.plan[0]).toFixed(1)+','+yv(m.base).toFixed(1)+' '+x(m.plan[1]).toFixed(1)+','+yv(m.target).toFixed(1)+' '+x(end).toFixed(1)+','+yv(m.target).toFixed(1);
  var s='<svg class="sp" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true"><polyline points="'+plan+'" fill="none" stroke="#8C99A1" stroke-width="1.4" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"/>';
  if(pts.length>1)s+='<polygon points="'+pts[0].split(',')[0]+','+H+' '+pts.join(' ')+' '+pts[pts.length-1].split(',')[0]+','+H+'" fill="rgba(var(--accent-rgb),.18)"/><polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--a5)" stroke-width="2.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>';
  if(t>=m.frm&&t<=end)s+='<line x1="'+x(t)+'" x2="'+x(t)+'" y1="0" y2="'+H+'" stroke="#E0A126" stroke-width="1.2" stroke-dasharray="2 3" vector-effect="non-scaling-stroke"/>';
  var last=pts.length?pts[pts.length-1].split(','):null;if(last)s+='<circle cx="'+last[0]+'" cy="'+last[1]+'" r="3" fill="#fff" stroke="var(--a5)" stroke-width="2"/>';return s+'</svg>'}
function heatCells(m,t){return QS.map(function(q){var s=mstate(m,q.t);return '<i class="'+(s.active&&s.status!=='ended'?s.status:'')+(Math.abs(q.t-t)<1e-6?' cur':'')+'" title="'+q.label+': '+G1.esc(s.lab)+'"></i>'}).join('')}
function ringHtml(p){var r=18,c=2*Math.PI*r;return '<svg viewBox="0 0 44 44"><circle class="trk" cx="22" cy="22" r="'+r+'"/><circle class="arc" cx="22" cy="22" r="'+r+'" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+(c*(1-p)).toFixed(1)+'"/></svg>'}
function valHtml(s){var m=s.m,k=m.basis==='sourced'?'add':'verify',n=(m.basis==='sourced'?'Sourced figure. ':'Illustrative value, invented to demonstrate the design. ')+m.note;return s.active?fxs(k,n,G1.esc(s.txt)):G1.esc(s.txt)}
function phaseNote(ph,cx){var ids=cx.P[ph].ids;if(!ids.length)return 'No initiatives in this phase';
  var done=ids.filter(function(i){return cx.I[i].p>=.999}),act=ids.filter(function(i){return cx.I[i].p>0&&cx.I[i].p<.999}),todo=ids.filter(function(i){return cx.I[i].p<=0});
  if(done.length===ids.length){var last=Math.max.apply(null,ids.map(function(i){return cx.I[i].end}));return 'Complete since <b>'+fmtQ(last-.25)+'</b>'}
  if(act.length){var nx=act.map(function(i){return{i:i,e:cx.I[i].end}}).sort(function(a,b){return a.e-b.e})[0];return '<b>'+nx.i+'</b> finishes '+fmtQ(nx.e-.25)}
  var first=Math.min.apply(null,todo.map(function(i){return cx.I[i].start})),id=todo.filter(function(i){return cx.I[i].start===first})[0];return '<b>'+id+'</b> starts '+fmtQ(first)}
/* ---------- journey timeline: where we are in the transition ---------- */
function journey(cx){var tot=(cx.P.crawl.avg+cx.P.walk.avg+cx.P.run.avg)/3,f=function(t){return clamp((t-T0)/(T1-T0),0,1)},ticks=[2015,2017,2019,2021,2023,2025];
  var ax='<div class="ax"><div></div><div class="a2">'+ticks.map(function(y){return '<span style="left:'+(f(y)*100)+'%">'+y+'</span>'}).join('')+'</div></div>';
  var rows=PH.map(function(ph){var ids=cx.P[ph].ids,s=Math.min.apply(null,ids.map(function(i){return cx.I[i].start})),e=Math.max.apply(null,ids.map(function(i){return cx.I[i].end})),P=cx.P[ph],L=f(s)*100,W=(f(e)-f(s))*100;
    var ms=ids.map(function(i){return '<i class="ms" title="'+i+' ends '+fmtQ(cx.I[i].end-.25)+'" style="left:'+(f(cx.I[i].end)*100)+'%"></i>'}).join('');
    return '<div class="jr '+ph+'"><div class="rl"><i></i>'+PHN[ph]+'</div><div class="ra"><div class="bar" style="left:'+L+'%;width:'+W+'%"><div class="fill" style="width:'+(P.avg*100)+'%"></div></div>'+ms+'<span class="pc" style="left:'+(f(e)*100)+'%">'+P.pct+'%</span></div></div>'}).join('');
  var lines=ticks.map(function(y){return '<i class="gl2" style="left:calc(58px + (100% - 58px) * '+f(y)+')"></i>'}).join('');
  var now='<div class="nowl" style="left:calc(58px + (100% - 58px) * '+f(cx.t)+')"><span>'+QS[qi].label+'</span></div>';
  document.getElementById('jny').innerHTML='<div class="tot"><span>Journey</span><b>'+Math.round(tot*100)+'%</b><small>schedule complete</small></div><div class="jt">'+lines+ax+rows+now+'</div>'}
/* ---------- render ---------- */
function render(){
  var Q=QS[qi],cx=CX=context(Q.t),H=health(cx);
  G1.save(KEYQ,{y:Q.y,q:Q.q});try{history.replaceState(null,'','?q='+Q.y+'-'+Q.q)}catch(e){}
  document.getElementById('qSel').value=qi;
  var hc=document.getElementById('health');hc.className='hcard '+H.col;document.getElementById('hRg').textContent={green:'\u2713',amber:'!',red:'\u00d7',grey:'\u2013'}[H.col];document.getElementById('hlB').textContent=H.name;
  document.getElementById('hlT').innerHTML=fxs('add','6.38 requires an overall health signal with a one-sentence rationale. It is generated from the metric statuses, so it changes with the quarter. Red = two or more metrics off track; Amber = one off track or any at risk; Green = all on track. The card changes colour with the level.',G1.esc(H.tx));
  var n=Math.max(1,H.n);document.getElementById('hSb').innerHTML=H.n?('<i class="g" style="width:'+(H.on/n*100)+'%"></i><i class="a" style="width:'+(H.risk/n*100)+'%"></i><i class="r" style="width:'+(H.off/n*100)+'%"></i>'):'<i style="width:100%;background:#C5CED4"></i>';
  document.getElementById('hLg').innerHTML=H.n?('<span><b>'+H.on+'</b> on track</span><span><b>'+H.risk+'</b> at risk</span><span><b>'+H.off+'</b> off track</span>'):'<span>No live metrics yet</span>';
  document.getElementById('qd').innerHTML=QS.map(function(x,i){var h=health(context(x.t)).col;return '<button type="button" class="'+({green:'g',amber:'a',red:'r'}[h]||'')+(i===qi?' cur':'')+'" data-i="'+i+'" title="'+x.label+'" aria-label="'+x.label+'"></button>'}).join('');
  journey(cx);
  PH.forEach(function(ph){var P=cx.P[ph],el=document.querySelector('.pnl.'+ph),ms=C.metrics.filter(function(m){return m.phase===ph}).map(function(m){return cx.M[m.id]});
    var rows=ms.map(function(s){return '<div class="mr '+s.status+'"><span class="sd '+s.status+'"></span><div class="mn"><b>'+G1.esc(s.m.name)+'</b><small>'+G1.esc(s.sub)+'</small></div>'+(s.active?spark(s.m,cx.t,104,36):'<span></span>')+'<div class="mv"><strong>'+valHtml(s)+'</strong><em class="'+s.status+'">'+G1.esc(s.lab)+'</em></div><div class="hm">'+heatCells(s.m,cx.t)+'</div></div>'}).join('');
    el.innerHTML='<div class="ph"><span class="rg">'+ringHtml(P.avg)+'<span class="pc">'+P.pct+'%</span></span><div><h2>'+PHN[ph]+'</h2><small>'+PHS[ph]+'</small></div><span class="st">'+P.lab+'</span></div><div class="pm">'+rows+'</div><div class="pf"><span>'+phaseNote(ph,cx)+'</span><button class="more" type="button">Details &#8599;</button></div>'});
  DEC=decisions(cx);var db=document.getElementById('dbot');[].forEach.call(db.querySelectorAll('.dc,.hz'),function(n){n.remove()});
  var html=DEC.map(function(d,i){var r=raciOf(d.n);return '<button class="dc" type="button" data-i="'+i+'"><span class="go">&#8599;</span><span class="top"><span class="nn">RACI '+d.n+'</span><span class="ty">'+G1.esc(TYPES[d.n])+'</span></span><span class="tx">'+G1.esc(d.text)+'</span><span class="rm4">'+['R','A','C','I'].map(function(k){return '<div class="'+(k==='A'?'a':'')+'"><b>'+k+'</b>'+avs(r[k],1)+'</div>'}).join('')+'</span></button>'}).join('');
  var need=3-DEC.length,hz=horizon(cx,need);
  html+=hz.map(function(e,i){var sp=(i===hz.length-1&&hz.length<need)?' style="grid-column:span '+(need-hz.length+1)+'"':'';return '<div class="hz"'+sp+'><span class="top"><span class="nn">On the horizon</span></span><span class="tx"><b style="font-weight:500">'+G1.esc(e.txt)+'</b><br>'+G1.esc(e.sub)+'</span></div>'}).join('');
  db.insertAdjacentHTML('beforeend',html);
  document.getElementById('dCount').innerHTML=fxs('add',"'Decisions required this quarter' lists decisions from your RACI (6.38: not new ones). They are generated from the metric statuses and from which roadmap initiatives start soon, so they change with the quarter. Dashed 'on the horizon' cards are not decisions: they fill the row with the next roadmap starts and finishes.",DEC.length+(DEC.length===1?' decision':' decisions')+' before the next QBR');
  if(openPh)fillSheet(openPh);if(G1.recount)G1.recount()}
/* ---------- quarter controls ---------- */
var sel=document.getElementById('qSel'),yrs={};QS.forEach(function(x,i){(yrs[x.y]=yrs[x.y]||[]).push('<option value="'+i+'">'+x.label+'</option>')});
sel.innerHTML=Object.keys(yrs).map(function(y){return '<optgroup label="'+y+'">'+yrs[y].join('')+'</optgroup>'}).join('');
function setQ(i){qi=clamp(i,0,QS.length-1);closeDec();render()}
sel.addEventListener('change',function(){stopPlay();setQ(+sel.value)});
document.getElementById('qPrev').addEventListener('click',function(){stopPlay();setQ(qi-1)});
document.getElementById('qNext').addEventListener('click',function(){stopPlay();setQ(qi+1)});
document.getElementById('qd').addEventListener('click',function(e){var b=e.target.closest('button');if(b){stopPlay();setQ(+b.dataset.i)}});
function stopPlay(){if(playT){clearInterval(playT);playT=null;document.getElementById('qPlay').innerHTML='\u25B6'}}
document.getElementById('qPlay').addEventListener('click',function(){if(playT){stopPlay();return}if(qi>=QS.length-1)qi=0;this.innerHTML='\u275A\u275A';render();playT=setInterval(function(){if(qi>=QS.length-1){stopPlay();return}setQ(qi+1)},1200)});
/* ---------- phase detail sheet ---------- */
var sheet=document.getElementById('dsheet'),scrim=document.getElementById('dscrim');
function fillSheet(ph){var cx=CX,P=cx.P[ph],ms=C.metrics.filter(function(m){return m.phase===ph}).map(function(m){return cx.M[m.id]});
  var ini=P.ids.map(function(id){var d=cx.I[id],st=d.p<=0?'Not started':(d.p>=.999?'Complete':'In progress');return '<div class="ic2"><div class="t"><span class="id">'+id+'</span><div><b>'+G1.esc(C.inits[id].short)+'</b><small>'+fmtQ(d.start)+' \u2013 '+fmtQ(d.end-.25)+' \u00b7 '+st+'</small></div></div><div class="bar"><i style="width:'+Math.round(d.p*100)+'%"></i></div><a href="roadmap.html#'+id+'">View on the roadmap \u2192</a></div>'}).join('')||'<p style="color:var(--ink-2)">No initiative is in this phase.</p>';
  var mc=ms.map(function(s){var m=s.m;return '<div class="mc"><div class="h"><b>'+G1.esc(m.name)+'</b><span class="kind">'+G1.esc(m.kind)+'</span></div><div class="big"><strong>'+valHtml(s)+'</strong><span>'+G1.esc(s.sub)+'</span></div>'+(s.active?spark(m,cx.t,300,76):'')+'<div class="heat">'+heatCells(m,cx.t)+'</div><div class="hl2"><span>2017</span><span>2021</span><span>2025</span></div><p>'+G1.esc(m.d)+'</p><div class="ft"><span class="mv" style="min-width:0"><em class="'+s.status+'">'+G1.esc(s.lab)+'</em></span>'+m.maps.map(function(i){return '<a class="tag" href="roadmap.html#'+i+'">'+i+'</a>'}).join('')+'<span class="tag s">'+(m.basis==='sourced'?'Sourced':(m.basis==='mixed'?'Baseline sourced':'Illustrative'))+'</span></div></div>'}).join('');
  sheet.innerHTML='<div class="ds-h"><span class="rg" style="position:relative;display:block;width:50px;height:50px">'+ringHtml(P.avg).replace('<svg','<svg style="width:50px;height:50px;transform:rotate(-90deg)"')+'<span style="position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:500">'+P.pct+'%</span></span><div><h2>'+PHN[ph]+' \u00b7 '+PHS[ph]+'</h2><small>'+QS[qi].label+' \u00b7 '+P.lab+'. Solid line = actual, dashed = plan, bars = status by quarter.</small></div><div class="sp"></div><button class="btn dark" id="dsClose" type="button">Close</button></div><div class="ds-b"><div><h3>Initiatives \u00b7 schedule completion</h3>'+ini+'</div><div><h3>Metrics</h3><div class="mg">'+mc+'</div></div></div>'}
function openSheet(ph,from){closeDec();openPh=ph;fillSheet(ph);var r=from.getBoundingClientRect(),s=sheet.getBoundingClientRect();sheet.style.transformOrigin=(r.left+r.width/2-s.left)+'px '+(r.top+r.height/2-s.top)+'px';requestAnimationFrame(function(){sheet.classList.add('show');scrim.classList.add('show')})}
function closeSheet(){openPh='';sheet.classList.remove('show');scrim.classList.remove('show')}
sheet.addEventListener('click',function(e){if(e.target.closest('#dsClose'))closeSheet()});scrim.addEventListener('click',closeSheet);
document.getElementById('dgrid').addEventListener('click',function(e){if(e.target.closest('a'))return;var n=e.target.closest('.pnl');if(n)openSheet(n.dataset.phase,n)});
document.getElementById('dgrid').addEventListener('keydown',function(e){var n=e.target.closest&&e.target.closest('.pnl');if(n&&(e.key==='Enter'||e.key===' ')&&e.target===n){e.preventDefault();openSheet(n.dataset.phase,n)}});
/* ---------- decision details ---------- */
var dd=document.getElementById('ddet'),DET=false;
function closeDec(){dd.classList.remove('show');DET=false}
document.getElementById('ddClose').addEventListener('click',closeDec);
document.getElementById('dbot').addEventListener('click',function(e){var b=e.target.closest('.dc');if(!b)return;var d=DEC[+b.dataset.i],r=raciOf(d.n),cx=CX;
  function col(k){return '<div class="col '+(k==='A'?'a':'')+'"><h5>'+{R:'Responsible',A:'Accountable',C:'Consulted',I:'Informed'}[k]+'</h5>'+(r[k].map(function(l){return '<div class="pl">'+G1.av(l,card(l).abbr,hue(l))+G1.esc(card(l).title)+'</div>'}).join('')||'<div class="pl">\u2014</div>')+'</div>'}
  var trg=d.trg.map(function(k){if(cx.M[k]){var s=cx.M[k];return '<span class="tag">'+k+' \u00b7 '+G1.esc(s.m.short)+': '+G1.esc(s.lab)+'</span>'}return '<a class="tag" href="roadmap.html#'+k+'">'+k+' \u00b7 '+G1.esc(C.inits[k].short)+'</a>'}).join('');
  document.getElementById('ddB').innerHTML='<span class="eyebrow">RACI decision '+d.n+' \u00b7 '+G1.esc(TYPES[d.n])+'</span><h4>'+G1.esc(d.text)+'</h4>'+(trg?'<p style="margin-bottom:2px"><b style="font-weight:500">Why now</b></p><div class="trg">'+trg+'</div>':'')+'<div class="g4">'+['R','A','C','I'].map(col).join('')+'</div><p><b style="font-weight:500">Why the Accountable role owns it.</b> '+G1.esc((rc&&rc[d.n]&&rc[d.n].why)||r.why)+'</p><div class="acts"><a class="btn dark sm arr" href="raci.html#d'+d.n+'">Open in the RACI</a></div>';
  dd.classList.add('show');DET=true;var rr=b.getBoundingClientRect(),w=dd.offsetWidth,h=dd.offsetHeight;dd.style.left=Math.max(16,Math.min(rr.left,innerWidth-w-16))+'px';dd.style.top=Math.max(80,rr.top-h-12)+'px'});
document.addEventListener('pointerdown',function(e){if(DET&&!dd.contains(e.target)&&!e.target.closest('.dc'))closeDec()});
document.addEventListener('keydown',function(e){if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key==='ArrowLeft'){stopPlay();setQ(qi-1)}else if(e.key==='ArrowRight'){stopPlay();setQ(qi+1)}else if(e.key==='Escape'){if(DET)closeDec();else if(openPh)closeSheet()}});
G1.reveal=function(){};
render();
})();

</script>
</body>
